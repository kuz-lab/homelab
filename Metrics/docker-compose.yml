# Grafana example. InfluxDB 3 is defined in influxdb3-compose.yml.
# Configure the data source separately; this file does not provision it.
# The former InfluxDB 2 definition is available in Git history.
services:
  grafana:
    image: grafana/grafana:13.1.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_DEFAULT_THEME=dark
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SERVER_ROOT_URL=https://grafana.kuzlab.dev
    networks:
      - metrics

volumes:
  grafana-data:

networks:
  metrics:
    driver: bridge
